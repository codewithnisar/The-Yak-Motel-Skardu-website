<!doctype html>

  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      display: inline-flex;

      gap: 8px;
      margin-top: 35px;
      padding: 14px 28px;

      color: #141311;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      transition: .3s;
    }
    .btn:hover {
